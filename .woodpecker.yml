steps:
  - name: set version in Cargo.toml
    image: rust:alpine
    commands:
      - echo "Setting Cargo.toml to version $CI_COMMIT_TAG:"
      - sed -i -e "s/99\.99\.9/$(echo $CI_COMMIT_TAG | tr -d 'v')/" Cargo.toml
      - cat Cargo.toml
    when:
      - event: tag

  - name: build
    image: rust:alpine
    commands:
      - apk add --no-cache musl-dev
      - cargo build --release
    when:
      - branch: master
        event: push
      - event: tag

  - name: publish
    image: plugins/github-release
    settings:
      api_key:
        from_secret: github-token
      files:
        - target/release/lagerist
      checksum:
        - sha256
    when:
      - event: tag

  - name: build docker image
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: docker.io
      repo: svedrin/lagerist
      username: svedrin
      password:
        from_secret: docker-registry-pw
      tags: latest
      cache: true
      cache_repo: docker.funzt-halt.net/lagerist-cache
    when:
      - branch: master
        event: push

  - name: build and tag docker release
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: docker.io
      repo: svedrin/lagerist
      username: svedrin
      password:
        from_secret: docker-registry-pw
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      cache: true
      cache_repo: docker.funzt-halt.net/lagerist-cache
    when:
      - event: tag
